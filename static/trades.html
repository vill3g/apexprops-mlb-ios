<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalshi AI - Full Trade Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .trade-win { border-left: 3px solid #10b981; }
        .trade-loss { border-left: 3px solid #ef4444; }
        .trade-open { border-left: 3px solid #3b82f6; }
    </style>
</head>
<body class="bg-[#0b0f19] text-white font-sans antialiased pb-10">

    <header class="sticky top-0 z-50 bg-[#0b0f19]/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h1 class="text-xs font-bold tracking-wider uppercase text-white">Full Trade Ledger</h1>
        </div>
        <button onclick="fetchTradesHistory()" class="w-8 h-8 flex items-center justify-center bg-gray-800 text-gray-300 rounded-lg active:scale-95 transition-all">
            <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
    </header>

    <main class="max-w-3xl mx-auto p-4">
        <div id="tradesContainer" class="space-y-3">
            <div class="text-center py-8 text-xs text-gray-500 font-mono">Loading...</div>
        </div>
    </main>

    <script>
        function getAuthHeaders() {
            const headers = {};
            const saasToken = localStorage.getItem("saas_token");
            if (saasToken) headers["Authorization"] = "Bearer " + saasToken;
            return headers;
        }

        async function fetchTradesHistory() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('animate-spin');
            
            const urlParams = new URLSearchParams(window.location.search);
            const guestId = urlParams.get("guest");
            let url = '/api/engine/BTC/trade/history';
            if (guestId) url += '?guest=' + guestId;

            try {
                const res = await fetch(url, { headers: getAuthHeaders() });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                renderTrades(Array.isArray(data) ? data : []);
            } catch (err) {
                document.getElementById("tradesContainer").innerHTML = '<div class="text-center text-red-500 text-xs py-8">' + err.message + '</div>';
            } finally {
                if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 500);
            }
        }

        function getTradeIdentifierPills(t) {
            const pills = [];
            const mode = String(t.mode || "PAPER").toUpperCase();
            const exitReason = String(t.exit_reason || t.reason || "").toUpperCase();
            const isManual = t.is_manual === true || exitReason === "MANUAL";

            if (mode === "LIVE") {
                pills.push('<span class="text-[8px] font-black px-1.5 py-0.5 rounded uppercase bg-red-500/20 text-red-300 border border-red-500/40">LIVE</span>');
            } else {
                pills.push('<span class="text-[8px] font-bold px-1.5 py-0.5 rounded uppercase bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">PAPER</span>');
            }

            if (isManual) {
                pills.push('<span class="text-[8px] font-bold px-1.5 py-0.5 rounded uppercase bg-amber-500/15 text-amber-300 border border-amber-500/35">MANUAL</span>');
            } else {
                const styleStr = t.trading_style ? String(t.trading_style).replace(/_/g, ' ') : "AUTO";
                pills.push('<span class="text-[8px] font-bold px-1.5 py-0.5 rounded uppercase bg-blue-500/20 text-blue-300 border border-blue-500/35">' + styleStr + '</span>');
            }

            if (t.is_profit_reentry) {
                pills.push('<span class="text-[8px] font-bold px-1.5 py-0.5 rounded uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/35">2ND ENTRY</span>');
            }
            if (t.is_reversal || t.is_reverse) {
                pills.push('<span class="text-[8px] font-bold px-1.5 py-0.5 rounded uppercase bg-purple-500/20 text-purple-400 border border-purple-500/35">REVERSAL</span>');
            }

            if (exitReason && exitReason !== 'KALSHI_POSITION_RECONCILED' && exitReason !== 'AI_SIGNAL' && exitReason !== 'SETTLEMENT' && !isManual) {
                let exitStr = exitReason.replace(/_/g, ' ');
                let exitColor = 'bg-slate-500/20 text-slate-400 border-slate-500/35';
                if (exitStr.includes('PROFIT') || exitStr.includes('TP')) exitColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/35';
                else if (exitStr.includes('STOP LOSS') || exitStr.includes('STOP_LOSS') || exitStr.includes('SL') || exitStr.includes('STOP')) exitColor = 'bg-red-500/20 text-red-400 border-red-500/35';
                pills.push('<span class="text-[8px] font-bold px-1.5 py-0.5 rounded uppercase border ' + exitColor + '">' + exitStr + '</span>');
            }

            return pills.join(" ");
        }

        function renderTrades(trades) {
            const container = document.getElementById("tradesContainer");
            if (!trades || trades.length === 0) {
                container.innerHTML = '<div class="text-center py-12 font-mono text-xs text-gray-500">No trades recorded yet.</div>';
                return;
            }

            container.innerHTML = trades.map(t => {
                const resStr = String(t.result || t.status || "").toUpperCase();
                const isWin = resStr.includes("WIN") || parseFloat(t.realized_pnl ?? t.pnl_dollars ?? t.pnl ?? 0) > 0;
                const isLoss = resStr.includes("LOSS") || parseFloat(t.realized_pnl ?? t.pnl_dollars ?? t.pnl ?? 0) < 0;

                let borderClass = "trade-open";
                let statusBadge = '<span class="text-[9px] font-bold text-blue-400">OPEN</span>';
                if (isWin) { borderClass = "trade-win"; statusBadge = '<span class="text-[9px] font-bold text-emerald-400">WIN</span>'; }
                else if (isLoss) { borderClass = "trade-loss"; statusBadge = '<span class="text-[9px] font-bold text-red-400">LOSS</span>'; }
                else if (resStr === "CLOSED") { statusBadge = '<span class="text-[9px] font-bold text-gray-400">CLOSED</span>'; }

                const pnlVal = parseFloat(t.realized_pnl ?? t.pnl_dollars ?? t.pnl ?? 0);
                const pnlColor = pnlVal > 0 ? "text-emerald-400" : (pnlVal < 0 ? "text-red-400" : "text-gray-400");
                const pnlStr = pnlVal > 0 ? "+$" + pnlVal.toFixed(2) : (pnlVal < 0 ? "-$" + Math.abs(pnlVal).toFixed(2) : ".00");

                const dir = String(t.direction || t.side || "").toUpperCase();
                const dirColor = (dir === "YES" || dir === "UP" || dir === "ABOVE") ? "text-green-400" : "text-red-400";

                return 
                    <div class="bg-[#131b2c] rounded-xl p-3 shadow-lg border border-gray-800  flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-white"></span>
                                <span class="text-[10px] font-black "></span>
                            </div>
                            <div class="flex items-center gap-2">
                                
                                <span class="text-xs font-mono font-bold "></span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-[10px] text-gray-400">
                            <span></span>
                            <span> Cont. @ </span>
                        </div>
                        <div class="flex flex-wrap gap-1 mt-1">
                            
                        </div>
                    </div>
                ;
            }).join("");
        }

        fetchTradesHistory();
    </script>
</body>
</html>
