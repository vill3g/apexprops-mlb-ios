<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BTC 15M // Trade List & Prediction Details</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 54px);
      --sab: env(safe-area-inset-bottom, 20px);
    }
    /* ABSOLUTE UNIVERSAL ZERO-BLUR ENFORCEMENT:
       Completely eradicate all backdrop-filter blur across every DOM element */
    *, *::before, *::after {
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
    }
    html, body {
      background-color: #000000 !important;
      background: #000000 !important;
      color: #ffffff !important;
      margin: 0 !important;
      padding: 0 !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      touch-action: pan-y;
      -webkit-font-smoothing: antialiased !important;
      overflow-x: hidden !important;
    }

    /* Fixed Top Navigation Bar:
       Solid pitch black background fills behind Dynamic Island.
       Content is safely offset by env(safe-area-inset-top) + 2px so it NEVER touches the status bar or triggers iOS blur! */
    .trade-nav-header {
      position: sticky !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 100 !important;
      width: 100% !important;
      background-color: #000000 !important;
      background: #000000 !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      filter: none !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
      padding-top: env(safe-area-inset-top, 54px) !important;
      padding-bottom: 8px !important;
      padding-left: 16px !important;
      padding-right: 16px !important;
      box-sizing: border-box !important;
    }

    .trade-nav-header *,
    .trade-nav-header a,
    .trade-nav-header button,
    .trade-nav-header span,
    .trade-nav-header h1 {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      filter: none !important;
    }

    .trade-card {
      background: #090e1a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      transition: all 0.2s ease;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .trade-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.6);
    }
    .trade-win {
      border-left: 4px solid #10b981 !important;
    }
    .trade-loss {
      border-left: 4px solid #ef4444 !important;
    }
    .trade-open {
      border-left: 4px solid #f59e0b !important;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    #iosStatusBarShield {
      display: block !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      height: env(safe-area-inset-top, 54px) !important;
      background: #000000 !important;
      background-color: #000000 !important;
      z-index: 2147483647 !important;
      pointer-events: none !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      filter: none !important;
      transform: translateZ(0) !important;
      -webkit-transform: translateZ(0) !important;
      will-change: transform !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Solid Opaque Black Status Bar Shield: Masks iOS status bar to eliminate WebKit blur -->
  <div id="iosStatusBarShield" aria-hidden="true"></div>

  <!-- TOP NAVIGATION BAR (Solid black, starts below Dynamic Island) -->
  <header class="trade-nav-header flex items-center justify-between w-full">
    <a href="/" aria-label="Back to chart" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 border border-white/15 text-xs font-bold text-slate-200 hover:text-white hover:border-cyan-400 active:scale-95 transition-all cursor-pointer">
      <span class="text-amber-400 text-sm leading-none">←</span>
      <span>Back to Chart</span>
    </a>

    <div class="flex flex-col items-center">
      <div class="flex items-center gap-1.5">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <h1 class="text-xs sm:text-sm font-black tracking-tight text-white font-sans uppercase">BTC 15M Trade List</h1>
      </div>
      <span class="text-[9px] font-mono text-cyan-400 mt-0.5">Last 10 Executions & Model Predictions</span>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="fetchTradesHistory()" aria-label="Refresh trades" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-slate-900 border border-white/10 flex items-center justify-center text-xs font-bold hover:bg-slate-800 text-slate-300 active:scale-95 transition-all cursor-pointer" title="Refresh Trades">
        <span id="refreshIcon" class="text-xs">⟳</span>
      </button>
    </div>
  </header>

  <!-- MAIN SCROLLABLE WRAPPER -->
  <div class="px-3 sm:px-6 py-2 sm:py-4 max-w-4xl mx-auto w-full flex-1 flex flex-col" style="padding-bottom: max(env(safe-area-inset-bottom, 24px), 24px);">

    <!-- SUMMARY STATS BAR -->
    <section class="flex flex-wrap sm:flex-nowrap items-center justify-between px-3 py-2 rounded-lg bg-slate-950/80 border border-slate-800/80 shadow-sm shadow-black/20 my-2 sm:my-3 font-mono text-[10px] sm:text-xs">
      <div class="flex items-center gap-1.5 shrink-0">
        <span class="text-slate-400 uppercase font-bold">Win Rate:</span>
        <span id="statWinRate" class="font-black text-emerald-400">--%</span>
        <span id="statRecord" class="text-[9px] sm:text-[10px] text-slate-500">0W - 0L</span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <span class="text-slate-400 uppercase font-bold">P&L:</span>
        <span id="statTotalPnl" class="font-black text-white">$0.00</span>
        <span id="statRoi" class="text-[9px] sm:text-[10px] text-slate-500">--% ROI</span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <span class="text-slate-400 uppercase font-bold">Avg Conf:</span>
        <span id="statAvgConviction" class="font-black text-cyan-300">--%</span>
      </div>
    </section>

    <!-- FILTER & VIEW CONTROLS -->
    <div class="flex items-center justify-between mb-2.5 px-1 font-mono text-[10px]">
      <div class="flex items-center gap-1.5">
        <span class="text-slate-400">View:</span>
        <button id="btnFilter10" onclick="setViewLimit(10)" class="px-2 py-0.5 rounded font-bold transition-all bg-cyan-600 text-white shadow-sm cursor-pointer">Last 10 Trades</button>
        <button id="btnFilterAll" onclick="setViewLimit(50)" class="px-2 py-0.5 rounded font-bold transition-all bg-slate-900 text-slate-400 hover:text-white cursor-pointer">All History</button>
      </div>
      <div class="flex items-center gap-1">
        <span id="tradeModeBadge" class="px-2 py-0.5 rounded bg-slate-900 border border-slate-800 font-bold uppercase text-[9px] text-cyan-400">Mode: ALL</span>
      </div>
    </div>

    <!-- TRADES LIST CONTAINER -->
    <main id="tradesContainer" class="space-y-2.5 flex-1 pb-6">
      <div class="text-center py-10 font-mono text-xs text-slate-500 animate-pulse">
        Loading trade history & prediction telemetry...
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto py-3 text-center border-t border-white/10 font-mono text-[9px] text-slate-500">
      <span>Kalshi KXBTC15M Autonomous AI Trader · OOG LLC · Verified Execution Log</span>
    </footer>

  </div>

  <script>
    let currentLimit = 10;
    let cachedTrades = [];

    function setViewLimit(limit) {
      currentLimit = limit;
      document.getElementById("btnFilter10").className = limit === 10 
        ? "px-2 py-0.5 rounded font-bold transition-all bg-cyan-600 text-white shadow-sm cursor-pointer"
        : "px-2 py-0.5 rounded font-bold transition-all bg-slate-900 text-slate-400 hover:text-white cursor-pointer";
      document.getElementById("btnFilterAll").className = limit !== 10 
        ? "px-2 py-0.5 rounded font-bold transition-all bg-cyan-600 text-white shadow-sm cursor-pointer"
        : "px-2 py-0.5 rounded font-bold transition-all bg-slate-900 text-slate-400 hover:text-white cursor-pointer";
      renderTrades(cachedTrades);
    }

    // Finding 6: HTML-escaping helper to prevent XSS from dynamic trade payloads
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str ?? "");
      return div.innerHTML;
    }

    function getAuthHeaders(customHeaders = {}) {
      const headers = { ...customHeaders };
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get("token") || urlParams.get("api_token");
        if (urlToken) {
          localStorage.setItem("app_api_token", urlToken);
          const cleanUrl = window.location.pathname + window.location.hash;
          try {
            window.history.replaceState({}, document.title, cleanUrl);
          } catch(e) { console.warn('replaceState failed', e); }
        }
        const token = localStorage.getItem("app_api_token") || "";
        if (token) {
          headers["X-API-Token"] = token;
        }
      } catch (err) {
        console.warn("getAuthHeaders error", err);
      }
      return headers;
    }

    async function fetchTradesHistory() {
      const urlParams = new URLSearchParams(window.location.search);
      const asset = urlParams.get('asset') || 'BTC';
      const refreshIcon = document.getElementById("refreshIcon");
      if (refreshIcon) refreshIcon.classList.add("animate-spin");
      let data = null;
      try {
        const res = await fetch(`/api/engine/${asset}/trade/history`, { headers: getAuthHeaders() });
        if (res.status === 401) {
          console.warn(`Authentication required for /api/engine/${asset}/trade/history`);
          document.getElementById("tradesContainer").innerHTML = `
            <div class="text-center py-8 font-mono text-xs text-amber-400 bg-amber-950/20 border border-amber-900/40 rounded-xl p-4">
              Authentication required on server. Set APP_API_TOKEN or launch with authorized credentials.
            </div>
          `;
          return;
        }
        if (!res.ok) throw new Error("HTTP " + res.status);
        data = await res.json();
      } catch (err) {
        console.error("Failed to load trades history:", err);
        document.getElementById("tradesContainer").innerHTML = `
          <div class="text-center py-8 font-mono text-xs text-red-400 bg-red-950/20 border border-red-900/40 rounded-xl p-4">
            Failed to connect to /api/engine/${asset}/trade/history: ${err.message}. Retrying in 5s...
          </div>
        `;
        if (refreshIcon) setTimeout(() => refreshIcon.classList.remove("animate-spin"), 500);
        return;
      }
      
      try {
        cachedTrades = Array.isArray(data) ? data : [];
        renderTrades(cachedTrades);
      } catch (err) {
        console.error("Failed to render trades history:", err);
        document.getElementById("tradesContainer").innerHTML = `
          <div class="text-center py-8 font-mono text-xs text-red-400 bg-red-950/20 border border-red-900/40 rounded-xl p-4">
            Render Error: ${err.message}
          </div>
        `;
      } finally {
        if (refreshIcon) setTimeout(() => refreshIcon.classList.remove("animate-spin"), 500);
      }
    }

    function getTradeIdentifierPills(t) {
      const pills = [];
      const mode = String(t.mode || "PAPER").toUpperCase();
      const src = String(t.trade_source || "").toUpperCase();
      const rec = String(t.recommendation || "").toUpperCase();
      const grade = String(t.conviction_grade || "").toUpperCase();
      const badge = String(t.conviction_badge || "").toUpperCase();
      const exitReason = String(t.exit_reason || "").toUpperCase();
      const catalysts = Array.isArray(t.catalysts) ? t.catalysts.map(c => String(c).toUpperCase()) : [];

      // 1. Paper vs Live Mode Pill
      if (mode === "LIVE") {
        pills.push(`<span class="text-[8px] font-black px-1.5 py-0.2 rounded uppercase bg-red-500/20 text-red-300 border border-red-500/40 shadow-sm shadow-red-950/40" title="Real Money Live Order">LIVE</span>`);
      } else {
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-cyan-500/20 text-cyan-300 border border-cyan-500/40" title="Simulated Paper Order">PAPER</span>`);
      }

      // 2. Execution Origin Pill (AUTO vs MANUAL)
      const isManual = t.is_manual === true || src.includes("MANUAL") || rec.includes("MANUAL") || grade.includes("MANUAL");
      if (isManual) {
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-amber-500/15 text-amber-300 border border-amber-500/35" title="Manually Executed by Trader">👤 MANUAL</span>`);
      } else {
        const isMg = src.includes("MOMENTUM_SURFER") || (t.trading_style && String(t.trading_style).toUpperCase().includes("MOMENTUM_SURFER"));
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-cyan-500/15 text-cyan-300 border border-cyan-500/35" title="Autonomous AI Execution">${isMg ? "🤖 AUTO (SURF)" : "🤖 AUTO"}</span>`);
      }

      // 3. Scalp Pill
      const isScalp = t.is_scalp === true || src.includes("SCALP") || rec.includes("SCALP") || grade.includes("SCALP") || catalysts.some(c => c.includes("SCALP")) || exitReason.includes("SCALP");
      if (isScalp) {
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-fuchsia-500/15 text-fuchsia-300 border border-fuchsia-500/40" title="Rapid Scalper Trade">⚡ SCALP</span>`);
      }

      // 4. Reverse Pill
      const isReverse = t.is_reverse === true || src.includes("REVERSE") || rec.includes("REVERSE") || badge.includes("REVERSE") || catalysts.some(c => c.includes("REVERSE"));
      if (isReverse) {
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-indigo-500/15 text-indigo-300 border border-indigo-500/40" title="CVD Divergence Reversal Setup">🔄 REVERSE</span>`);
      }

      // 5. Exit Reason Pill (when closed early before expiry)
      if (exitReason.includes("SCALP_TP") || exitReason.includes("TAKE_PROFIT")) {
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/40" title="Take-Profit Target Reached">🎯 TP EXIT</span>`);
      } else if (exitReason.includes("SCALP_SL") || exitReason.includes("STOP_LOSS")) {
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-rose-500/20 text-rose-300 border border-rose-500/40" title="Stop-Loss Triggered">🛑 SL EXIT</span>`);
      } else if (exitReason.includes("MANUAL")) {
        pills.push(`<span class="text-[8px] font-bold px-1.5 py-0.2 rounded uppercase bg-amber-500/15 text-amber-300 border border-amber-500/35" title="Trader Manually Closed Position">🚪 MANUAL EXIT</span>`);
      }

      return pills.join(" ");
    }

    function renderTrades(trades) {
      const container = document.getElementById("tradesContainer");
      if (!trades || trades.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 font-mono text-xs text-slate-500 bg-slate-950 border border-white/5 rounded-2xl p-6">
            No trades recorded yet. Stand by for active 15M contract window.
          </div>
        `;
        return;
      }

      const displayList = (trades || []).filter(t => t && typeof t === 'object').slice(0, currentLimit);

      // Compute global statistics for all trades
      let wins = 0, losses = 0, totalPnl = 0, totalCost = 0, totalProb = 0, probCount = 0;
      (trades || []).forEach(t => {
        if (!t || typeof t !== 'object') return;
        const res = String(t.result || "").toUpperCase();
        const pnl = parseFloat(t.realized_pnl ?? t.pnl ?? 0);
        const cost = parseFloat(t.cost || 0);
        totalPnl += pnl;
        totalCost += cost;
        if (res.includes("WIN")) wins++;
        else if (res.includes("LOSS")) losses++;

        const prob = parseFloat(t.probability_percent || 0);
        if (prob > 0) {
          totalProb += prob;
          probCount++;
        }
      });

      const winRate = (wins + losses) > 0 ? Math.round((wins / (wins + losses)) * 100) : 0;
      const roi = totalCost > 0 ? ((totalPnl / totalCost) * 100).toFixed(1) : "0.0";

      const wrEl = document.getElementById("statWinRate");
      if (wrEl) wrEl.innerText = `${winRate}%`;
      const recEl = document.getElementById("statRecord");
      if (recEl) recEl.innerText = `${wins}W - ${losses}L (${displayList.length} total)`;
      
      const pnlEl = document.getElementById("statTotalPnl");
      if (pnlEl) {
        pnlEl.innerText = `${totalPnl >= 0 ? "+" : ""}$${totalPnl.toFixed(2)}`;
        pnlEl.classList.remove("text-emerald-400", "text-red-400");
        pnlEl.classList.add(totalPnl >= 0 ? "text-emerald-400" : "text-red-400");
      }
      
      const roiEl = document.getElementById("statRoi");
      if (roiEl) roiEl.innerText = `${roi >= 0 ? "+" : ""}${roi}% ROI`;
      const avgConvEl = document.getElementById("statAvgConviction");
      if (avgConvEl) avgConvEl.innerText = probCount > 0 ? `${Math.round(totalProb / probCount)}%` : "--%";

      // Render Individual Trade Cards
      container.innerHTML = displayList.map((t, idx) => {
        const resStr = String(t.result || "").toUpperCase();
        const statStr = String(t.status || "").toUpperCase();
        const isWin = resStr.includes("WIN");
        const isLoss = resStr.includes("LOSS");
        const isClosed = statStr === "CLOSED" || statStr === "SETTLED";

        let borderClass = "trade-open";
        let badgeBg = "bg-amber-500/15 text-amber-300 border-amber-500/30";
        let statusBadgeText = "ACTIVE / OPEN";

        if (isWin) {
          borderClass = "trade-win";
          badgeBg = "bg-emerald-500/15 text-emerald-400 border-emerald-500/30";
          statusBadgeText = "WIN";
        } else if (isLoss) {
          borderClass = "trade-loss";
          badgeBg = "bg-red-500/15 text-red-400 border-red-500/30";
          statusBadgeText = "LOSS";
        } else if (isClosed) {
          borderClass = "trade-open";
          badgeBg = "bg-slate-800 text-slate-300 border-slate-700";
          statusBadgeText = "CLOSED";
        }

        const pnlVal = parseFloat(t.realized_pnl ?? t.pnl ?? 0);
        const pnlFormatted = `${pnlVal >= 0 ? "+" : ""}$${pnlVal.toFixed(2)}`;
        const pnlColor = pnlVal >= 0 ? "text-emerald-400" : "text-red-400";

        const direction = String(t.direction || t.side || "").toUpperCase();
        const isUp = direction.includes("UP") || direction.includes("ABOVE") || direction.includes("YES");
        const dirArrow = isUp ? "▲" : "▼";
        const dirText = isUp ? "BID UP (YES)" : "BID DOWN (NO)";

        const entryPrice = t.entry_price ? `$${parseFloat(t.entry_price).toFixed(2)}` : "--";
        const exitPrice = t.exit_price ?? t.last_exit_price ? `$${parseFloat(t.exit_price ?? t.last_exit_price).toFixed(2)}` : "--";
        const strike = t.strike ? `$${Number(t.strike).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : "--";
        const count = t.count ? `${t.count} ct` : "1 ct";
        const cost = t.cost ? `$${parseFloat(t.cost).toFixed(2)}` : "--";
        const mode = (t.mode || "LIVE").toUpperCase();

        const convictionPct = t.probability_percent ? `${t.probability_percent}%` : "--%";
        const convictionGrade = t.conviction_grade || "AI MODEL";
        const convictionBadge = t.conviction_badge || (t.recommendation ? t.recommendation.replace("MANUAL ", "") : "AUTONOMOUS");
        const exitReason = t.exit_reason ? t.exit_reason.replace(/_/g, " ") : (isClosed ? "SETTLED" : "IN PROGRESS");

        // Catalysts / Prediction reasons list
        const catalysts = Array.isArray(t.catalysts) && t.catalysts.length > 0 ? t.catalysts : ["Technical Momentum Confluence", "15M Target Strike Delta Alignment"];

        return `
          <div class="trade-card ${borderClass} p-3 sm:p-4 font-mono space-y-3">
            <!-- Row 1: Header with Index, Ticker, Timestamp & Result Badge -->
            <div class="flex items-center justify-between flex-wrap gap-2 border-b border-white/10 pb-2">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="px-1.5 py-0.5 rounded bg-slate-900 border border-white/15 text-[9px] font-black text-slate-300">#${idx + 1}</span>
                <span class="text-xs sm:text-sm font-black text-white font-sans">${escapeHtml(t.ticker || "KXBTC15M")}</span>
                ${getTradeIdentifierPills(t)}
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[9px] text-slate-400">${escapeHtml(t.timestamp || t.closed_at || "--")}</span>
                <span class="px-2 py-0.5 rounded-full border text-[9px] font-black uppercase tracking-wider ${badgeBg}">
                  ${escapeHtml(statusBadgeText)} ${isClosed ? `(${escapeHtml(pnlFormatted)})` : ''}
                </span>
              </div>
            </div>

            <!-- Row 2: Financials & Trade Execution Details -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px] bg-slate-950/70 p-2.5 rounded-xl border border-white/5">
              <div class="flex flex-col">
                <span class="text-[8px] text-slate-500 uppercase">Target Strike</span>
                <span class="font-bold text-white text-xs sm:text-sm">${escapeHtml(strike)}</span>
              </div>
              <div class="flex flex-col">
                <span class="text-[8px] text-slate-500 uppercase">Side / Action</span>
                <div class="inline-flex items-center gap-1 font-bold text-xs ${isUp ? 'text-emerald-400' : 'text-red-400'}">
                  <span>${escapeHtml(dirArrow)}</span>
                  <span>${escapeHtml(dirText)}</span>
                </div>
              </div>
              <div class="flex flex-col">
                <span class="text-[8px] text-slate-500 uppercase">Entry → Exit</span>
                <span class="font-bold text-slate-200">${entryPrice} → ${exitPrice}</span>
              </div>
              <div class="flex flex-col">
                <span class="text-[8px] text-slate-500 uppercase">Size / P&L</span>
                <span class="font-bold ${pnlColor}">${count} (${cost}) → ${pnlFormatted}</span>
              </div>
            </div>

            <!-- Row 3: Dedicated Prediction & ML Intelligence Panel -->
            <div class="p-2.5 rounded-xl bg-cyan-950/20 border border-cyan-500/25 space-y-2">
              <div class="flex items-center justify-between text-[9px] sm:text-[10px]">
                <div class="flex items-center gap-1.5">
                  <span class="text-cyan-400 font-black tracking-wider uppercase">🧠 PREDICTION METRICS:</span>
                  <span class="px-1.5 py-0.2 rounded font-black text-[8px] uppercase bg-cyan-950 border border-cyan-400/40 text-cyan-300">${convictionGrade}</span>
                </div>
                <div class="flex items-center gap-1 text-[9px]">
                  <span class="text-slate-400">Exit Reason:</span>
                  <span class="text-amber-300 font-bold uppercase">${exitReason}</span>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[9px]">
                <div class="flex items-center justify-between px-2 py-1 rounded bg-black/40 border border-white/5">
                  <span class="text-slate-400">Model Conviction:</span>
                  <div class="flex items-center gap-1.5">
                    <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                      <div class="h-full bg-cyan-400" style="width: ${parseInt(t.probability_percent || 65)}%;"></div>
                    </div>
                    <span class="font-bold text-cyan-300 font-mono">${convictionPct}</span>
                  </div>
                </div>
                <div class="flex items-center justify-between px-2 py-1 rounded bg-black/40 border border-white/5">
                  <span class="text-slate-400">Signal Directive:</span>
                  <span class="font-bold text-slate-200 truncate max-w-[150px]">${t.recommendation || convictionBadge}</span>
                </div>
              </div>

              <!-- Catalysts / Confluence Tags -->
              <div class="flex flex-wrap items-center gap-1 pt-0.5">
                <span class="text-[7.5px] uppercase font-bold text-slate-500 mr-1">Catalysts:</span>
                ${catalysts.map(c => `
                  <span class="text-[7.5px] font-sans px-1.5 py-0.5 rounded bg-slate-900/90 text-slate-300 border border-white/10 flex items-center gap-1">
                    <span class="text-cyan-400">•</span> ${c}
                  </span>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    let isFetchingHistory = false;
    async function fetchTradesHistorySafe() {
      if (isFetchingHistory) return;
      isFetchingHistory = true;
      try {
        await fetchTradesHistory();
      } catch (err) {
        console.warn("fetchTradesHistory error:", err);
      } finally {
        isFetchingHistory = false;
      }
    }

    // Auto load on start & refresh every 5 seconds
    fetchTradesHistorySafe();
    setInterval(() => {
      if (document.hidden) return;
      fetchTradesHistorySafe();
    }, 5000);
  </script>
</body>
</html>
