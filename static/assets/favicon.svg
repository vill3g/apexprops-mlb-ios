<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#140b24"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#9d00ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="110" fill="none" stroke="#9d00ff" stroke-width="6" opacity="0.6"/>

  <!-- AI: Circuit Traces & Neural Nodes -->
  <g stroke="#9d00ff" stroke-width="4" opacity="0.45" fill="none">
    <polyline points="70,100 140,100 170,140"/>
    <polyline points="100,70 100,130 140,170"/>
    <polyline points="442,412 372,412 342,372"/>
    <polyline points="412,442 412,382 372,342"/>
    <polyline points="432,110 382,110 352,140"/>
    <polyline points="80,402 130,402 160,372"/>
  </g>
  <g fill="#00f0ff" opacity="0.85">
    <circle cx="70" cy="100" r="5"/>
    <circle cx="140" cy="100" r="6"/>
    <circle cx="170" cy="140" r="6"/>
    <circle cx="100" cy="70" r="5"/>
    <circle cx="100" cy="130" r="6"/>
    <circle cx="140" cy="170" r="6"/>
    <circle cx="442" cy="412" r="5"/>
    <circle cx="372" cy="412" r="6"/>
    <circle cx="342" cy="372" r="6"/>
    <circle cx="412" cy="442" r="5"/>
    <circle cx="412" cy="382" r="6"/>
    <circle cx="372" cy="342" r="6"/>
    <circle cx="432" cy="110" r="5"/>
    <circle cx="382" cy="110" r="6"/>
    <circle cx="352" cy="140" r="6"/>
    <circle cx="80" cy="402" r="5"/>
    <circle cx="130" cy="402" r="6"/>
    <circle cx="160" cy="372" r="6"/>
  </g>

  <!-- Trading: Stepping Candlestick Bars -->
  <g opacity="0.4">
    <!-- Candle 1: Red/Down -->
    <line x1="130" y1="240" x2="130" y2="360" stroke="#ff4060" stroke-width="4"/>
    <rect x1="117" y1="270" width="26" height="70" rx="4" fill="#ff4060" opacity="0.6"/>
    <!-- Candle 2: Green/Up -->
    <line x1="185" y1="200" x2="185" y2="330" stroke="#00ff80" stroke-width="4"/>
    <rect x1="172" y1="230" width="26" height="80" rx="4" fill="#00ff80" opacity="0.6"/>
    <!-- Candle 3: Green/Up -->
    <line x1="240" y1="170" x2="240" y2="290" stroke="#00ff80" stroke-width="4"/>
    <rect x1="227" y1="195" width="26" height="75" rx="4" fill="#00ff80" opacity="0.6"/>
    <!-- Candle 4: Pullback -->
    <line x1="295" y1="190" x2="295" y2="320" stroke="#ff4060" stroke-width="4"/>
    <rect x1="282" y1="215" width="26" height="80" rx="4" fill="#ff4060" opacity="0.6"/>
    <!-- Candle 5: Strong Green -->
    <line x1="350" y1="130" x2="350" y2="260" stroke="#00ff80" stroke-width="4"/>
    <rect x1="337" y1="160" width="26" height="80" rx="4" fill="#00ff80" opacity="0.6"/>
    <!-- Candle 6: Breakout Green -->
    <line x1="405" y1="100" x2="405" y2="220" stroke="#00ff80" stroke-width="4"/>
    <rect x1="392" y1="120" width="26" height="80" rx="4" fill="#00ff80" opacity="0.6"/>
  </g>

  <!-- Charts: Upward Trendline & Glowing Arrow -->
  <polyline points="100,340 180,285 255,250 330,190 410,110" fill="none" stroke="#00f0ff" stroke-width="12" filter="url(#glow)" opacity="0.5"/>
  <polyline points="100,340 180,285 255,250 330,190 410,110" fill="none" stroke="url(#trendGrad)" stroke-width="6"/>
  <polygon points="410,110 380,113 408,140" fill="#00f0ff"/>

  <!-- Crypto & AI: Central Bitcoin Holographic Core -->
  <circle cx="256" cy="256" r="95" fill="#0b0814" stroke="#9d00ff" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Bitcoin '₿' Symbol -->
  <g fill="#ffffff" filter="url(#glow)">
    <path d="M232,196 L232,316 M232,204 L264,204 C278,204 288,212 288,226 C288,238 278,248 264,248 L232,248 M232,248 L270,248 C285,248 296,258 296,274 C296,290 285,300 270,300 L232,300" 
          fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bitcoin vertical hashes -->
    <line x1="248" y1="184" x2="248" y2="204" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="264" y1="184" x2="264" y2="204" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="248" y1="300" x2="248" y2="320" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="264" y1="300" x2="264" y2="320" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
